syntax = "proto3";
option go_package="github.com/lanpioneer/microservice-protocol/grpc_microservice_in_go/golang/payment";
message CreatePaymentRequest {
  float price = 1;
}
message CreatePaymentResponse {
  int64 bill_id = 1;
}
service Payment {
    rpc Create(CreatePaymentRequest)
      returns (CreatePaymentResponse) {}
}